[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-lab"
version = "0.1.0"
description = "Outcome-first evaluations for tool-using agents, with inspectable traces and routing baselines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "VahidKz"}]
dependencies = []

[project.scripts]
agent-eval = "agent_eval_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval_lab*"]

[tool.setuptools.package-data]
agent_eval_lab = ["data/*.json", "templates/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
